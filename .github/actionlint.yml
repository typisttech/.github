# actionlint validates `runs-on` against a built-in list of GitHub-hosted labels.
# Both labels below are real GitHub-hosted runners, not self-hosted; this key is
# simply actionlint's only mechanism for teaching it a label it does not yet know.
#
# See: https://github.com/rhysd/actionlint/issues/682
#
# TODO: Remove after actionlint recognises them on its own.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm

paths:
  .github/workflows/**/*.{yml,yaml}:
    # actionlint mistreat `background` & `parallel` as invalid syntax.
    #
    # See: https://github.com/rhysd/actionlint/issues/693
    #
    # TODO: Remove after actionlint recognises them on its own.
    ignore:
      - 'unexpected key "background" for step to run shell command'
      - 'step must run script with "run" section or run action with
          "uses" section'
