name: Lint PHP

on:
  workflow_call:
    inputs:
      # composer-normalize
      composer-normalize:
        description: Whether to run composer-normalize.
        default: true
        type: boolean
      composer-normalize-php-version:
        description: The PHP version for composer-normalize to use.
        default: '8.5'
        type: string
      composer-normalize-version:
        description: The composer-normalize version to use.
        default: '2'
        type: string

      # phpstan
      phpstan:
        description: Whether to run phpstan.
        default: false
        type: boolean

      # mago
      mago:
        description: Whether to run mago.
        default: false
        type: boolean
      mago-version:
        description: The mago version to use.
        default: '1'
        type: string

      # box
      box:
        description: Whether to validate box config.
        default: false
        type: boolean
      box-php-version:
        description: The PHP version for box to use.
        default: '8.5'
        type: string
      box-version:
        description: The box version to use.
        default: '4'
        type: string

permissions: {}

jobs:
  composer-normalize:
    if: ${{ inputs.composer-normalize }}
    runs-on: ubuntu-26.04
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
            sparse-checkout: composer.json
            sparse-checkout-cone-mode: false

        - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
          with:
            php-version: ${{ inputs.composer-normalize-php-version }}
            coverage: none
            tools: "composer-normalize:${{ inputs.composer-normalize-version }}"

      - run: composer-normalize --dry-run

  php-matrix:
    permissions:
      contents: read
    if: ${{ inputs.phpstan || inputs.mago }}
    runs-on: ubuntu-slim
    outputs:
      versions: ${{ steps.php-matrix.outputs.versions }}
      highest: ${{ steps.php-matrix.outputs.highest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: composer.json
          sparse-checkout-cone-mode: false

      - uses: typisttech/php-matrix-action@74ecfe279f564c78619eeacfd2f470cb80a7db61 # v3.1.1
        id: php-matrix

  phpstan:
    permissions:
      contents: read
    if: ${{ inputs.phpstan }}
    needs: php-matrix
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        prefer:
          - highest
          - locked
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
          with:
            php-version: ${{ needs.php-matrix.outputs.highest }}
            coverage: none

      - uses: $/.github/actions/composer-install
        with:
          prefer: ${{ matrix.prefer }}

      - run: vendor/bin/phpstan analyse --error-format=github

  mago:
    permissions:
      contents: read
    if: ${{ inputs.mago }}
    needs: php-matrix
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        prefer:
          - highest
          - locked
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
          with:
            php-version: ${{ needs.php-matrix.outputs.highest }}
            coverage: none
            tools: "mago:${{ inputs.mago-version }}"

      - uses: $/.github/actions/composer-install
        with:
          prefer: ${{ matrix.prefer }}

      - parallel:
        - run: mago format --check
        - run: mago lint
        - run: mago analyze

  box:
    permissions:
      contents: read
    if: ${{ inputs.box }}
    runs-on: ubuntu-26.04
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
            fetch-depth: 0

        - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
          with:
            php-version: ${{ inputs.box-php-version }}
            coverage: none
            tools: "box:${{ inputs.box-version }}"

      - run: box validate
