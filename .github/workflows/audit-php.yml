name: Audit PHP

on:
  workflow_call:

permissions: {}

jobs:
  php-matrix:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    outputs:
      versions: ${{ steps.php-matrix.outputs.versions }}
      lowest: ${{ steps.php-matrix.outputs.lowest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: composer.json
          sparse-checkout-cone-mode: false

      - uses: typisttech/php-matrix-action@0545a7d54db2c7be158b615b1e7f458ae6e99ad3 # v3.0.2
        id: php-matrix

  composer-audit:
    permissions:
      contents: read
      security-events: write
      actions: read
    needs: php-matrix
    runs-on: ubuntu-26.04
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
            sparse-checkout: |
              composer.json
              composer.lock
            sparse-checkout-cone-mode: false

        - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
          with:
            php-version: latest
            coverage: none

      - run: composer audit --locked --format json > audit.json
        continue-on-error: true

      - uses: typisttech/composer-audit-to-sarif-action@b92b7e7b6e54c84918cf6a5e8ffe8058d6749f9e # v0.1.4
        id: comsarif
        with:
          audit: audit.json

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.comsarif.outputs.sarif }}
          category: composer
