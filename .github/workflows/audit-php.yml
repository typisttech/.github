name: Audit PHP

on:
  workflow_call:

permissions: {}

jobs:
  composer-audit:
    permissions:
      security-events: write
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
            sparse-checkout: |
              composer.json
              composer.lock
            sparse-checkout-cone-mode: false

        - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
          with:
            php-version: '8.5'
            coverage: none

      - run: composer audit --locked --format json > audit.json
        continue-on-error: true

      - uses: typisttech/composer-audit-to-sarif-action@ea2d9b661995ad0aea09e80d61d1dc610a83c0d1 # v0.1.5
        id: comsarif
        with:
          audit: audit.json

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ steps.comsarif.outputs.sarif }}
          category: composer
