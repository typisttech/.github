name: Go Proxy

on:
  workflow_call:

permissions: {}

cache-mode: none

jobs:
  go-proxy:
    cache-mode: none
    runs-on: ubuntu-slim
    env:
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false

      - parallel:
        - run: go list -m -u -json -x "github.com/$GITHUB_REPOSITORY@$GITHUB_REF_NAME"
          continue-on-error: true
        - run: go list -m -u -json -x "github.com/$GITHUB_REPOSITORY@$GITHUB_SHA"
          continue-on-error: true
