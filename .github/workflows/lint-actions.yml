name: Lint GitHub Actions

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '11 2 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Taken from https://github.com/rhysd/actionlint/blob/dc8cca81866af081bdd0e0653474916d7046c5c5/docs/usage.md#use-actionlint-on-github-actions
  # See also: https://github.com/rhysd/actionlint/issues/117#issuecomment-1132835368
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows
          sparse-checkout-cone-mode: false

      - name: Check workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  zizmor:
    runs-on: ubuntu-slim
    permissions:
      security-events: write
      contents: read # only needed for private or internal repos
      actions: read # only needed for private or internal repos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  wait-for-all-lint:
    if: cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure')
    needs:
      - actionlint
      - zizmor
    runs-on: ubuntu-slim
    steps:
      - name: Assert no required jobs were cancelled or failed
        run: exit 1
