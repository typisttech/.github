name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs: &inputs
      tag:
        description: Release tag
        required: false
        type: string
  workflow_call:
    inputs: *inputs

concurrency:
  group: tt-dot-github-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  release-drafter:
    runs-on: ubuntu-slim
    permissions:
      contents: write # for updating release notes
      pull-requests: read # for fetching list of changes
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          tag: ${{ inputs.tag }}
