name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs: &inputs
      tag:
        description: Release tag.
        required: false
        type: string
  workflow_call:
    inputs: *inputs

concurrency:
  group: tt-dot-github-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  release-drafter:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: read
    cache-mode: none
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          tag: ${{ inputs.tag }}
