# Taken from https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#enabling-automerge-on-a-pull-request
# and https://github.com/dependabot/fetch-metadata/blob/06ea45a2e4582d87b11f03c7ce596ae3261f39f6/README.md?plain=1#L133-L160
name: Dependabot Auto-merge

on:
  workflow_call:
    inputs:
      major:
        description: Whether to merge major updates.
        default: false
        type: boolean
      minor:
        description: Whether to merge minor updates.
        default: false
        type: boolean
      patch:
        description: Whether to merge patch updates.
        default: false
        type: boolean
      strategy:
        description: The strategy to use for updating the pull request. Must be one of 'merge', 'squash', or 'rebase'.
        default: squash
        type: string

    secrets:
      client-id:
        description: GitHub App Client ID that will use to create, update and close the pull request.
        required: true
      private-key:
        description: GitHub App private key that will use to create, update and close the pull request.
        required: true

permissions: {}

cache-mode: none

jobs:
  auto-merge-pull-request:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && (inputs.major || inputs.minor || inputs.patch)
    permissions:
      contents: read
      pull-requests: read
    cache-mode: none
    runs-on: ubuntu-slim
    steps:
      - if: ${{ !contains(fromJSON('["merge", "squash", "rebase"]'), inputs.strategy) }}
        run: |
          echo "::error title=Invalid strategy::Must be one of 'merge', 'squash', or 'rebase'"
          exit 1

      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ github.token }}"
        background: true

      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.client-id }}
          private-key: ${{ secrets.private-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
        background: true

      - wait-all:

      - if: |
          (inputs.major && steps.dependabot-metadata.outputs.update-type == 'version-update:semver-major')
          || (inputs.minor && steps.dependabot-metadata.outputs.update-type == 'version-update:semver-minor')
          || (inputs.patch && steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto "--$STRATEGY" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STRATEGY: ${{ inputs.strategy }}
